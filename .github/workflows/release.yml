name: Publish test APK

on:
  push:
    branches: [main]
    paths: ['.github/release-request.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-test-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate requested version
        id: version
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          request = json.loads(pathlib.Path('.github/release-request.json').read_text())
          version = request['version']
          code = request['version_code']
          assert re.fullmatch(r'\d+\.\d+\.\d+-test', version), version
          assert type(code) is int and code > 0
          build = pathlib.Path('app/build.gradle').read_text()
          assert re.search(r"versionName\s*=\s*'" + re.escape(version) + "'", build)
          assert re.search(r'versionCode\s*=\s*' + str(code) + r'\b', build)
          assert pathlib.Path('docs/releases/' + version + '.md').is_file()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and check
        run: ./gradlew --no-daemon :app:check :app:assembleDebug :app:assembleRelease
      - name: Inspect APK packaging
        run: |
          python3 -m pip install androguard loguru
          python3 tests/inspect_apk.py app/build/outputs/apk/debug/app-debug.apk
          python3 tests/inspect_apk.py app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Prepare download and checksums
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p build/release
          cp app/build/outputs/apk/debug/app-debug.apk "build/release/FocusAllowlist-${RELEASE_VERSION}.apk"
          cd build/release
          sha256sum "FocusAllowlist-${RELEASE_VERSION}.apk" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: build/release/*
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" \
            "build/release/FocusAllowlist-${RELEASE_VERSION}.apk" \
            build/release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "专注模式 ${RELEASE_VERSION}" \
            --notes-file "docs/releases/${RELEASE_VERSION}.md"
