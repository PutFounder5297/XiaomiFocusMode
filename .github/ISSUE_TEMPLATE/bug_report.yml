name: 问题反馈
description: 报告可复现的安装或使用问题
body:
  - type: textarea
    id: environment
    attributes:
      label: 使用环境
      description: 模块版本、小米设置版本及 versionCode、设备与 ROM 版本、LSPosed 版本和作用域。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志或截图（可选）
      description: 请先脱敏，只附相关片段；不要上传系统 APK/JAR 或完整私人日志。
