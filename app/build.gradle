import javax.inject.Inject

plugins {
    id 'com.android.application'
}

android {
    namespace = 'dev.lance.focusallowlist'
    compileSdk = 35

    defaultConfig {
        applicationId = 'dev.lance.focusallowlist'
        minSdk = 28
        targetSdk = 35
        versionCode = 24
        versionName = '0.1.23-test'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

dependencies {
    // LSPosed supplies these classes at runtime; never bundle them in the APK.
    compileOnly 'de.robv.android.xposed:api:82'
    testImplementation 'junit:junit:4.13.2'
}

abstract class VerifyIsland extends DefaultTask {
    @Classpath abstract ConfigurableFileCollection getTestClasspath()
    @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getVerifier()
    @Input abstract Property<String> getPython()
    @Inject abstract ExecOperations getExecOperations()

    @TaskAction
    void verify() {
        execOperations.exec {
            commandLine python.get(), verifier.get().asFile, testClasspath.asPath
        }
    }
}

// Check JSON generated by the production Java code with the existing Python fixtures.
def islandVerifier = rootProject.file('tests/verify_island.py')
def pythonCommand = providers.gradleProperty('python').orElse('python3')
afterEvaluate {
    def debugTests = tasks.named('testDebugUnitTest', Test)
    tasks.register('verifyIsland', VerifyIsland) {
        group = 'verification'
        description = 'Checks production island JSON fixtures on the host.'
        dependsOn debugTests
        verifier.set(islandVerifier)
        python.set(pythonCommand)
        testClasspath.from(debugTests.map { it.classpath })
    }
    tasks.named('check') {
        dependsOn 'verifyIsland'
    }
}
